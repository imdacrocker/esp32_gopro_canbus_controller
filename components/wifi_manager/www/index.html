<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GoPro Controller</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 2em auto; padding: 0 1em; }
        h1   { font-size: 1.4em; }
        #status  { color: #555; margin: 0.5em 0 1em; min-height: 1.2em; }
        #scan-btn { padding: 0.6em 1.4em; font-size: 1em; cursor: pointer; }
        #scan-btn:disabled { opacity: 0.5; cursor: default; }
        #control-bar { display: flex; gap: 0.8em; margin: 1.2em 0 0.4em; }
        #start-btn { padding: 0.7em 1.6em; font-size: 1.05em; font-weight: bold;
                     background: #27ae60; color: #fff; border: none; border-radius: 4px; cursor: pointer; flex: 1; }
        #start-btn:disabled { opacity: 0.5; cursor: default; }
        #stop-btn  { padding: 0.7em 1.6em; font-size: 1.05em; font-weight: bold;
                     background: #e74c3c; color: #fff; border: none; border-radius: 4px; cursor: pointer; flex: 1; }
        #stop-btn:disabled  { opacity: 0.5; cursor: default; }
        #results { margin-top: 1.5em; }
        .camera  { display: flex; justify-content: space-between; align-items: center;
                   padding: 0.6em 0; border-bottom: 1px solid #ddd; }
        .camera-info { font-size: 0.9em; color: #333; }
        .camera-name { font-weight: bold; }
        .pair-btn { padding: 0.4em 1em; cursor: pointer; }

        /* Camera status panel */
        #cam-status-section { margin-top: 2em; border-top: 2px solid #ddd; padding-top: 1em; }
        #cam-status-section h2 { font-size: 1em; margin: 0 0 0.6em; color: #333; }
        .cam-row { display: flex; justify-content: space-between; align-items: center;
                   padding: 0.5em 0; border-bottom: 1px solid #eee; font-size: 0.9em; }
        .cam-id  { color: #888; margin-right: 0.5em; }
        .cam-name-display { font-size: 0.95em; }
        .cam-badge { padding: 0.2em 0.6em; border-radius: 4px; font-size: 0.85em;
                     font-weight: bold; white-space: nowrap; }
        .badge-disconnected { background: #ddd;    color: #555; }
        .badge-connected    { background: #d4eaff; color: #1a6aac; }
        .badge-recording    { background: #e74c3c; color: #fff; }
        .badge-not_recording{ background: #eaf5ea; color: #2e7d32; }
        #cam-status-empty   { color: #888; font-size: 0.9em; }
        .remove-btn { padding: 0.2em 0.55em; font-size: 0.85em; cursor: pointer;
                      background: none; border: 1px solid #c0392b; color: #c0392b;
                      border-radius: 3px; line-height: 1; }
        .remove-btn:hover { background: #c0392b; color: #fff; }

        /* RaceCapture logging state pill + UTC row */
        #status-row { display: flex; align-items: center; gap: 0.8em; margin: 0.4em 0 0.6em; flex-wrap: wrap; }
        #rc-logging-pill { display: inline-block; padding: 0.3em 0.9em;
                           border-radius: 1em; font-size: 0.85em; font-weight: bold;
                           letter-spacing: 0.02em; }
        .rc-logging     { background: #27ae60; color: #fff; }
        .rc-not-logging { background: #ddd;    color: #555; }
        .rc-unknown     { background: #f39c12; color: #fff; }
        #utc-display { font-size: 0.9em; color: #555; font-family: monospace; }
        #scan-row { margin-bottom: 0.6em; }

        /* Automatic control toggle row */
        #auto-control-row { display: flex; align-items: center; gap: 0.6em; margin: 0.2em 0 0.6em; }
        #auto-control-label { font-size: 0.9em; color: #333; }
        .toggle-switch { position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; inset: 0;
                         background: #ccc; border-radius: 24px; transition: background 0.2s; }
        .toggle-slider:before { content: ''; position: absolute; width: 18px; height: 18px;
                                 left: 3px; bottom: 3px; background: #fff; border-radius: 50%;
                                 transition: transform 0.2s; }
        .toggle-switch input:checked + .toggle-slider { background: #27ae60; }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }
    </style>
</head>
<body>
    <h1>GoPro Controller</h1>
    <div id="status-row">
        <div id="rc-logging-pill" class="rc-unknown">RC: Unknown</div>
        <span id="utc-display">--:--:-- UTC</span>
    </div>
    <div id="auto-control-row">
        <label class="toggle-switch">
            <input type="checkbox" id="auto-control-toggle" onchange="setAutoControl(this.checked)" checked>
            <span class="toggle-slider"></span>
        </label>
        <span id="auto-control-label">Automatic Control</span>
    </div>
    <div id="scan-row">
        <button id="scan-btn" onclick="startScan()">Scan for Cameras</button>
    </div>

    <div id="control-bar">
        <button id="start-btn" onclick="sendShutter(true)">&#9654; Start Recording</button>
        <button id="stop-btn"  onclick="sendShutter(false)">&#9632; Stop Recording</button>
    </div>

    <p id="status"></p>
    <div id="results"></div>

    <div id="cam-status-section">
        <h2>Camera Status</h2>
        <div id="cam-status-list"><p id="cam-status-empty">No cameras paired.</p></div>
    </div>

    <script>
        var pollTimer = null;

        function setStatus(msg) {
            document.getElementById('status').textContent = msg;
        }

        var BADGE_LABEL = {
            disconnected:  'Disconnected',
            connected:     'Connected',
            recording:     'Recording',
            not_recording: 'Not recording'
        };

        function refreshCameraStatus() {
            fetch('/api/paired-cameras')
                .then(function(r) { return r.json(); })
                .then(function(cameras) {
                    var list = document.getElementById('cam-status-list');
                    if (cameras.length === 0) {
                        list.innerHTML = '<p id="cam-status-empty">No cameras paired.</p>';
                        return;
                    }
                    var html = '';
                    cameras.forEach(function(cam) {
                        var label = BADGE_LABEL[cam.status] || cam.status;
                        var displayName = cam.model_name || cam.name;
                        var safeName = displayName.replace(/"/g, '&quot;');
                        html += '<div class="cam-row">'
                              + '<div><span class="cam-id">#' + cam.index + '</span>'
                              + '<span class="cam-name-display">' + displayName + '</span></div>'
                              + '<div style="display:flex;align-items:center;gap:0.5em">'
                              + '<span class="cam-badge badge-' + cam.status + '">' + label + '</span>'
                              + '<button class="remove-btn" onclick="removeCamera(' + cam.slot + ',\'' + safeName + '\')" title="Remove camera">&times;</button>'
                              + '</div>'
                              + '</div>';
                    });
                    list.innerHTML = html;
                })
                .catch(function() {});
        }

        /* Refresh camera status on load and every 3 seconds */
        refreshCameraStatus();
        setInterval(refreshCameraStatus, 3000);

        var RC_LOGGING_LABELS = {
            'logging':     'RC: Logging',
            'not_logging': 'RC: Not Logging',
            'unknown':     'RC: Unknown'
        };

        function refreshLoggingState() {
            fetch('/api/logging-state')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var s   = data.state || 'unknown';
                    var el  = document.getElementById('rc-logging-pill');
                    el.className  = 'rc-' + s.replace('_', '-');
                    el.textContent = RC_LOGGING_LABELS[s] || ('RC: ' + s);
                })
                .catch(function() {});

            fetch('/api/utc')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var utcEl = document.getElementById('utc-display');
                    if (data.valid) {
                        var d = new Date(data.epoch_ms);
                        var h = String(d.getUTCHours()).padStart(2, '0');
                        var m = String(d.getUTCMinutes()).padStart(2, '0');
                        var s = String(d.getUTCSeconds()).padStart(2, '0');
                        utcEl.textContent = h + ':' + m + ':' + s + ' UTC';
                    } else {
                        utcEl.textContent = 'No GPS';
                    }
                })
                .catch(function() {});

            fetch('/api/auto-control')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    document.getElementById('auto-control-toggle').checked = !!data.enabled;
                })
                .catch(function() {});
        }

        refreshLoggingState();
        setInterval(refreshLoggingState, 2000);

        function setAutoControl(enabled) {
            fetch('/api/auto-control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled: enabled })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                /* Sync the toggle to whatever the server confirms */
                document.getElementById('auto-control-toggle').checked = !!data.enabled;
            })
            .catch(function() {
                /* On error, re-fetch the real state so the toggle isn't left lying */
                fetch('/api/auto-control')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        document.getElementById('auto-control-toggle').checked = !!data.enabled;
                    })
                    .catch(function() {});
            });
        }

        function startScan() {
            document.getElementById('scan-btn').disabled = true;
            document.getElementById('results').innerHTML = '';
            setStatus('Scanning... (30 seconds)');

            fetch('/api/scan', { method: 'POST' })
                .then(function(r) { return r.json(); })
                .then(function() {
                    pollTimer = setInterval(pollCameras, 1000);
                    setTimeout(stopScan, 31000);
                })
                .catch(function() {
                    setStatus('Error starting scan.');
                    document.getElementById('scan-btn').disabled = false;
                });
        }

        function stopScan() {
            clearInterval(pollTimer);
            pollCameras(); /* final poll */
            setStatus('Scan complete.');
            document.getElementById('scan-btn').disabled = false;
        }

        function pollCameras() {
            Promise.all([
                fetch('/api/cameras').then(function(r) { return r.json(); }),
                fetch('/api/paired-cameras').then(function(r) { return r.json(); })
            ])
            .then(function(results) {
                var discovered = results[0];
                var paired     = results[1];
                var pairedAddrs = {};
                paired.forEach(function(cam) { pairedAddrs[cam.addr] = true; });
                var unpaired = discovered.filter(function(cam) { return !pairedAddrs[cam.addr]; });
                renderCameras(unpaired);
            })
            .catch(function() {});
        }

        function renderCameras(cameras) {
            var div = document.getElementById('results');
            if (cameras.length === 0) {
                div.innerHTML = '<p>No cameras found yet.</p>';
                return;
            }
            var html = '';
            cameras.forEach(function(cam) {
                html += '<div class="camera">'
                      + '<div class="camera-info">'
                      + '<div class="camera-name">' + cam.name + '</div>'
                      + '<div>' + cam.addr + '&nbsp;&nbsp;' + cam.rssi + ' dBm</div>'
                      + '</div>'
                      + '<button class="pair-btn" onclick="pairCamera(\''
                      + cam.addr + '\',' + cam.addr_type + ')">Pair</button>'
                      + '</div>';
            });
            div.innerHTML = html;
        }

        function removeCamera(slot, name) {
            if (!confirm('Remove "' + name + '"?\nIt will need to re-pair before it can reconnect.')) return;
            fetch('/api/remove-camera', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ slot: slot })
            })
            .then(function(r) { return r.json(); })
            .then(function() {
                setStatus('Camera removed.');
                refreshCameraStatus();
            })
            .catch(function() { setStatus('Error removing camera.'); });
        }

        function pairCamera(addr, addrType) {
            setStatus('Pairing with ' + addr + '...');
            fetch('/api/pair', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ addr: addr, addr_type: addrType })
            })
            .then(function(r) { return r.json(); })
            .then(function() { setStatus('Pairing initiated. Check serial log for result.'); })
            .catch(function() { setStatus('Error sending pair request.'); });
        }

        function sendShutter(on) {
            var startBtn = document.getElementById('start-btn');
            var stopBtn  = document.getElementById('stop-btn');
            startBtn.disabled = true;
            stopBtn.disabled  = true;
            setStatus((on ? 'Starting' : 'Stopping') + ' recording...');

            fetch('/api/shutter', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ on: on })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var n = data.dispatched || 0;
                if (n === 0) {
                    setStatus('No cameras ready — is any camera connected and GATT-set-up?');
                } else {
                    setStatus((on ? 'Record started' : 'Record stopped') +
                              ' on ' + n + ' camera' + (n === 1 ? '' : 's') + '.');
                }
            })
            .catch(function() { setStatus('Error sending shutter command.'); })
            .finally(function() {
                startBtn.disabled = false;
                stopBtn.disabled  = false;
            });
        }
    </script>
</body>
</html>
