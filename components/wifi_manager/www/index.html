<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GoPro Controller</title>
    <style>
        /* ---- Base ---- */
        body {
            font-family: sans-serif;
            max-width: 480px;
            margin: 2em auto;
            /* Extra bottom padding so content doesn't hide under the fixed button bar */
            padding: 0 1em 5em;
        }
        h1 { font-size: 1.4em; }
        #status { color: #555; margin: 0.5em 0 1em; min-height: 1.2em; }

        /* ---- Record control buttons ---- */
        #control-bar {
            display: flex; gap: 0.8em; margin: 1.2em 0 0.4em;
        }
        #start-btn {
            padding: 0.7em 1.6em; font-size: 1.05em; font-weight: bold;
            background: #27ae60; color: #fff; border: none; border-radius: 4px;
            cursor: pointer; flex: 1;
        }
        #start-btn:disabled { opacity: 0.5; cursor: default; }
        #stop-btn {
            padding: 0.7em 1.6em; font-size: 1.05em; font-weight: bold;
            background: #e74c3c; color: #fff; border: none; border-radius: 4px;
            cursor: pointer; flex: 1;
        }
        #stop-btn:disabled { opacity: 0.5; cursor: default; }

        /* ---- Camera status section (main screen, read-only) ---- */
        #cam-status-section {
            margin-top: 2em; border-top: 2px solid #ddd; padding-top: 1em;
        }
        #cam-status-section h2 { font-size: 1em; margin: 0 0 0.6em; color: #333; }
        .cam-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.5em 0; border-bottom: 1px solid #eee; font-size: 0.9em;
        }
        .cam-id  { color: #888; margin-right: 0.5em; }
        .cam-name-display { font-size: 0.95em; }
        .cam-badge {
            padding: 0.2em 0.6em; border-radius: 4px; font-size: 0.85em;
            font-weight: bold; white-space: nowrap;
        }
        .badge-disconnected  { background: #ddd;    color: #555; }
        .badge-connected     { background: #d4eaff; color: #1a6aac; }
        .badge-recording     { background: #e74c3c; color: #fff; }
        .badge-not_recording { background: #eaf5ea; color: #2e7d32; }
        #cam-status-empty    { color: #888; font-size: 0.9em; }
        .cam-shutter-btn {
            padding: 0.25em 0.65em; font-size: 0.8em; font-weight: bold;
            border: none; border-radius: 3px; cursor: pointer; white-space: nowrap;
        }
        .cam-shutter-start { background: #27ae60; color: #fff; }
        .cam-shutter-stop  { background: #e74c3c; color: #fff; }
        .cam-shutter-btn:disabled { background: #e0e0e0; color: #bbb; cursor: default; }

        /* ---- RC logging pill + UTC ---- */
        #status-row {
            display: flex; align-items: center; gap: 0.8em;
            margin: 0.4em 0 0.6em; flex-wrap: wrap;
        }
        #rc-logging-pill {
            display: inline-block; padding: 0.3em 0.9em;
            border-radius: 1em; font-size: 0.85em; font-weight: bold;
            letter-spacing: 0.02em;
        }
        .rc-logging     { background: #27ae60; color: #fff; }
        .rc-not-logging { background: #ddd;    color: #555; }
        .rc-unknown     { background: #f39c12; color: #fff; }
        #utc-display { font-size: 0.9em; color: #555; font-family: monospace; }

        /* ---- Auto-control toggle ---- */
        #auto-control-row {
            display: flex; align-items: center; gap: 0.6em; margin: 0.2em 0 0.6em;
        }
        #auto-control-label { font-size: 0.9em; color: #333; }
        .toggle-switch {
            position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink: 0;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; cursor: pointer; inset: 0;
            background: #ccc; border-radius: 24px; transition: background 0.2s;
        }
        .toggle-slider:before {
            content: ''; position: absolute; width: 18px; height: 18px;
            left: 3px; bottom: 3px; background: #fff; border-radius: 50%;
            transition: transform 0.2s;
        }
        .toggle-switch input:checked + .toggle-slider { background: #27ae60; }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }

        /* ---- Fixed bottom bar ---- */
        #manage-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #fff; border-top: 1px solid #ddd;
            padding: 0.75em 1em;
            display: flex; justify-content: center;
            z-index: 100;
        }
        #manage-btn {
            padding: 0.65em 1.8em; font-size: 1em; font-weight: bold;
            background: #2980b9; color: #fff;
            border: none; border-radius: 4px; cursor: pointer;
            width: 100%; max-width: 480px;
        }
        #manage-btn:hover { background: #2471a3; }

        /* ---- Modal overlay (slides up from bottom) ---- */
        #modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 200;
            display: flex; align-items: flex-end; justify-content: center;
        }
        #modal-overlay.hidden { display: none; }
        .modal {
            background: #fff;
            border-radius: 12px 12px 0 0;
            width: 100%; max-width: 480px;
            max-height: 85vh; overflow-y: auto;
            padding: 1.2em 1em 2em;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1em;
        }
        .modal-header h2 { font-size: 1.1em; margin: 0; }
        .modal-close-btn {
            background: none; border: none; font-size: 1.4em;
            cursor: pointer; color: #555; line-height: 1; padding: 0 0.2em;
        }
        .modal-close-btn:hover { color: #000; }

        /* ---- Modal sections ---- */
        .modal-section { margin-bottom: 1.5em; }
        .modal-section h3 {
            font-size: 0.85em; color: #888; text-transform: uppercase;
            letter-spacing: 0.05em; margin: 0 0 0.6em;
            border-bottom: 1px solid #eee; padding-bottom: 0.4em;
        }
        .modal-cam-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.55em 0; border-bottom: 1px solid #f0f0f0; font-size: 0.9em;
        }
        .modal-cam-name { font-weight: 500; }
        .empty-msg { color: #888; font-size: 0.9em; margin: 0.4em 0; }
        .remove-btn {
            padding: 0.2em 0.55em; font-size: 0.85em; cursor: pointer;
            background: none; border: 1px solid #c0392b; color: #c0392b;
            border-radius: 3px; line-height: 1;
        }
        .remove-btn:hover { background: #c0392b; color: #fff; }

        /* ---- Scan / discovered cameras (inside modal) ---- */
        #scan-btn { padding: 0.6em 1.4em; font-size: 1em; cursor: pointer; }
        #scan-btn:disabled { opacity: 0.5; cursor: default; }
        #modal-status { color: #555; font-size: 0.9em; min-height: 1.2em; margin: 0.5em 0; }
        .camera {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.6em 0; border-bottom: 1px solid #ddd;
        }
        .camera-info { font-size: 0.9em; color: #333; }
        .camera-name { font-weight: bold; }
        .pair-btn { padding: 0.4em 1em; cursor: pointer; }
    </style>
</head>
<body>
    <h1>GoPro Controller</h1>

    <div id="status-row">
        <div id="rc-logging-pill" class="rc-unknown">RC: Unknown</div>
        <span id="utc-display">--:--:-- UTC</span>
    </div>

    <div id="auto-control-row">
        <label class="toggle-switch">
            <input type="checkbox" id="auto-control-toggle" onchange="setAutoControl(this.checked)" checked>
            <span class="toggle-slider"></span>
        </label>
        <span id="auto-control-label">Automatic Control</span>
    </div>

    <!-- Hidden by default — shown only when Automatic Control is off -->
    <div id="control-bar" style="display:none">
        <button id="start-btn" onclick="sendShutter(true)">&#9654; Start Recording</button>
        <button id="stop-btn"  onclick="sendShutter(false)">&#9632; Stop Recording</button>
    </div>

    <p id="status"></p>

    <!-- Live camera status — read-only; add/remove is handled in the modal -->
    <div id="cam-status-section">
        <h2>Camera Status</h2>
        <div id="cam-status-list"><p id="cam-status-empty">No cameras paired.</p></div>
    </div>

    <!-- ============================================================
         Add / Manage Cameras Modal (bottom sheet)
    ============================================================ -->
    <div id="modal-overlay" class="hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Manage Cameras</h2>
                <button class="modal-close-btn" onclick="closeModal()" title="Close">&#10005;</button>
            </div>

            <!-- Section 1: paired cameras with remove option -->
            <div class="modal-section">
                <h3>Paired Cameras</h3>
                <div id="modal-paired-list">
                    <p class="empty-msg">No cameras paired.</p>
                </div>
            </div>

            <!-- Section 2: scan for new cameras -->
            <div class="modal-section">
                <h3>Add New Camera</h3>
                <button id="scan-btn" onclick="handleScanButton()">Scan for Cameras</button>
                <p id="modal-status"></p>
                <div id="results"></div>
            </div>
        </div>
    </div>

    <!-- ============================================================
         Fixed bottom bar
    ============================================================ -->
    <div id="manage-bar">
        <button id="manage-btn" onclick="openModal()">+ Add / Manage Cameras</button>
    </div>

    <script>
        var pollTimer              = null;
        var scanning               = false;
        var modalPairedRefreshTimer = null;
        /* Mirrors the firmware's auto-control flag.  true = firmware boot default.
         * Updated on every /api/auto-control poll and on manual toggle. */
        var autoControlEnabled = true;

        /* ---- Utility ---- */

        function setStatus(msg) {
            document.getElementById('status').textContent = msg;
        }

        function setScanStatus(msg) {
            document.getElementById('modal-status').textContent = msg;
        }

        /* ---- Manual control visibility ---- */

        function updateManualControlVisibility() {
            /* Show the all-camera control bar only in manual mode */
            document.getElementById('control-bar').style.display =
                autoControlEnabled ? 'none' : 'flex';
            /* Per-camera buttons are rendered inside refreshCameraStatus(),
             * so force an immediate re-render to add/remove them right away. */
            refreshCameraStatus();
        }

        /* ---- Modal open / close ---- */

        function openModal() {
            document.getElementById('modal-overlay').classList.remove('hidden');
            refreshModalPairedCameras();
            modalPairedRefreshTimer = setInterval(refreshModalPairedCameras, 2000);
        }

        function closeModal() {
            /* Cancel any running scan so the BLE radio isn't left scanning */
            if (scanning) { cancelScan(); }

            /* Stop the modal's paired-camera refresh */
            if (modalPairedRefreshTimer) {
                clearInterval(modalPairedRefreshTimer);
                modalPairedRefreshTimer = null;
            }

            /* Reset modal UI state */
            document.getElementById('results').innerHTML   = '';
            document.getElementById('modal-paired-list').innerHTML =
                '<p class="empty-msg">No cameras paired.</p>';
            setScanStatus('');

            document.getElementById('modal-overlay').classList.add('hidden');
        }

        /* Clicking the backdrop (outside the card) closes the modal */
        document.getElementById('modal-overlay').addEventListener('click', function (e) {
            if (e.target === this) { closeModal(); }
        });

        /* ---- Modal: paired camera list (name + remove only) ---- */

        function refreshModalPairedCameras() {
            fetch('/api/paired-cameras')
                .then(function (r) { return r.json(); })
                .then(function (cameras) {
                    var list = document.getElementById('modal-paired-list');
                    if (cameras.length === 0) {
                        list.innerHTML = '<p class="empty-msg">No cameras paired yet.</p>';
                        return;
                    }
                    var html = '';
                    cameras.forEach(function (cam) {
                        var displayName = cam.model_name || cam.name;
                        /* Escape for use inside an onclick string attribute */
                        var safeName = displayName.replace(/\\/g, '\\\\')
                                                  .replace(/'/g, "\\'");
                        html += '<div class="modal-cam-row">'
                              + '<span class="modal-cam-name">' + displayName + '</span>'
                              + '<button class="remove-btn" '
                              +   'onclick="modalRemoveCamera(' + cam.slot + ',\'' + safeName + '\')" '
                              +   'title="Remove camera">&times;</button>'
                              + '</div>';
                    });
                    list.innerHTML = html;
                })
                .catch(function () {});
        }

        function modalRemoveCamera(slot, name) {
            if (!confirm('Remove "' + name + '"?\nIt will need to re-pair before it can reconnect.')) {
                return;
            }
            fetch('/api/remove-camera', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ slot: slot })
            })
            .then(function (r) { return r.json(); })
            .then(function () {
                refreshModalPairedCameras();
                refreshCameraStatus();   /* keep main screen in sync */
            })
            .catch(function () {});
        }

        /* ---- Main screen: camera status (read-only badges, no remove buttons) ---- */

        var BADGE_LABEL = {
            disconnected:  'Disconnected',
            connected:     'Connected',
            recording:     'Recording',
            not_recording: 'Not recording'
        };

        function refreshCameraStatus() {
            fetch('/api/paired-cameras')
                .then(function (r) { return r.json(); })
                .then(function (cameras) {
                    var list = document.getElementById('cam-status-list');
                    if (cameras.length === 0) {
                        list.innerHTML = '<p id="cam-status-empty">No cameras paired.</p>';
                        return;
                    }
                    var html = '';
                    cameras.forEach(function (cam) {
                        var label       = BADGE_LABEL[cam.status] || cam.status;
                        var displayName = cam.model_name || cam.name;

                        /* Per-camera shutter toggle — only in manual mode,
                         * and hidden when disconnected.
                         * id="cam-shutter-N" lets setCameraRecording() disable it
                         * immediately; the next poll re-renders fresh enabled buttons. */
                        var btn = '';
                        if (!autoControlEnabled && cam.status === 'not_recording') {
                            btn = '<button id="cam-shutter-' + cam.slot + '"'
                                + ' class="cam-shutter-btn cam-shutter-start"'
                                + ' onclick="setCameraRecording(' + cam.slot + ',true)">'
                                + '&#9654; Start</button>';
                        } else if (!autoControlEnabled && cam.status === 'recording') {
                            btn = '<button id="cam-shutter-' + cam.slot + '"'
                                + ' class="cam-shutter-btn cam-shutter-stop"'
                                + ' onclick="setCameraRecording(' + cam.slot + ',false)">'
                                + '&#9632; Stop</button>';
                        }

                        html += '<div class="cam-row">'
                              + '<div><span class="cam-id">#' + cam.index + '</span>'
                              + '<span class="cam-name-display">' + displayName + '</span></div>'
                              + '<div style="display:flex;align-items:center;gap:0.5em">'
                              + '<span class="cam-badge badge-' + cam.status + '">' + label + '</span>'
                              + btn
                              + '</div>'
                              + '</div>';
                    });
                    list.innerHTML = html;
                })
                .catch(function () {});
        }

        refreshCameraStatus();
        setInterval(refreshCameraStatus, 3000);

        /* ---- RC logging state + UTC + auto-control (polled together) ---- */

        var RC_LOGGING_LABELS = {
            'logging':     'RC: Logging',
            'not_logging': 'RC: Not Logging',
            'unknown':     'RC: Unknown'
        };

        function refreshLoggingState() {
            fetch('/api/logging-state')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var s  = data.state || 'unknown';
                    var el = document.getElementById('rc-logging-pill');
                    el.className   = 'rc-' + s.replace('_', '-');
                    el.textContent = RC_LOGGING_LABELS[s] || ('RC: ' + s);
                })
                .catch(function () {});

            fetch('/api/utc')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var utcEl = document.getElementById('utc-display');
                    if (data.valid) {
                        var d = new Date(data.epoch_ms);
                        var h = String(d.getUTCHours()).padStart(2, '0');
                        var m = String(d.getUTCMinutes()).padStart(2, '0');
                        var s = String(d.getUTCSeconds()).padStart(2, '0');
                        utcEl.textContent = h + ':' + m + ':' + s + ' UTC';
                    } else {
                        utcEl.textContent = 'No GPS';
                    }
                })
                .catch(function () {});

            fetch('/api/auto-control')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var prev = autoControlEnabled;
                    autoControlEnabled = !!data.enabled;
                    document.getElementById('auto-control-toggle').checked = autoControlEnabled;
                    /* Only re-render when the value actually changed */
                    if (autoControlEnabled !== prev) { updateManualControlVisibility(); }
                })
                .catch(function () {});
        }

        refreshLoggingState();
        setInterval(refreshLoggingState, 2000);

        /* ---- Auto-control toggle ---- */

        function setAutoControl(enabled) {
            fetch('/api/auto-control', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ enabled: enabled })
            })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                autoControlEnabled = !!data.enabled;
                document.getElementById('auto-control-toggle').checked = autoControlEnabled;
                updateManualControlVisibility();
            })
            .catch(function () {
                /* On error, re-fetch the real state so the toggle isn't left lying */
                fetch('/api/auto-control')
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        autoControlEnabled = !!data.enabled;
                        document.getElementById('auto-control-toggle').checked = autoControlEnabled;
                        updateManualControlVisibility();
                    })
                    .catch(function () {});
            });
        }

        /* ---- Scan (lives inside the modal) ---- */

        function setScanningState(active) {
            scanning = active;
            var btn = document.getElementById('scan-btn');
            btn.textContent = active ? 'Cancel Scan' : 'Scan for Cameras';
        }

        function handleScanButton() {
            if (scanning) { cancelScan(); } else { startScan(); }
        }

        function startScan() {
            document.getElementById('results').innerHTML = '';
            setScanStatus('Scanning\u2026 (30 seconds)');
            setScanningState(true);

            fetch('/api/scan', { method: 'POST' })
                .then(function (r) { return r.json(); })
                .then(function () {
                    pollTimer = setInterval(pollCameras, 1000);
                    setTimeout(function () {
                        if (scanning) { stopScan(); }
                    }, 31000);
                })
                .catch(function () {
                    setScanStatus('Error starting scan.');
                    setScanningState(false);
                });
        }

        function stopScan() {
            clearInterval(pollTimer);
            pollTimer = null;
            pollCameras();   /* final poll */
            setScanStatus('Scan complete.');
            setScanningState(false);
        }

        function cancelScan() {
            fetch('/api/scan-cancel', { method: 'POST' }).catch(function () { /* best-effort */ });
            clearInterval(pollTimer);
            pollTimer = null;
            setScanStatus('Scan cancelled.');
            setScanningState(false);
        }

        function pollCameras() {
            Promise.all([
                fetch('/api/cameras').then(function (r) { return r.json(); }),
                fetch('/api/paired-cameras').then(function (r) { return r.json(); })
            ])
            .then(function (results) {
                var discovered  = results[0];
                var paired      = results[1];
                var pairedAddrs = {};
                paired.forEach(function (cam) { pairedAddrs[cam.addr] = true; });
                var unpaired = discovered.filter(function (cam) { return !pairedAddrs[cam.addr]; });
                renderCameras(unpaired);
            })
            .catch(function () {});
        }

        function renderCameras(cameras) {
            var div = document.getElementById('results');
            if (cameras.length === 0) {
                div.innerHTML = '<p class="empty-msg">No cameras found yet.</p>';
                return;
            }
            var html = '';
            cameras.forEach(function (cam) {
                html += '<div class="camera">'
                      + '<div class="camera-info">'
                      + '<div class="camera-name">' + cam.name + '</div>'
                      + '<div>' + cam.addr + '&nbsp;&nbsp;' + cam.rssi + ' dBm</div>'
                      + '</div>'
                      + '<button class="pair-btn" onclick="pairCamera(\''
                      + cam.addr + '\',' + cam.addr_type + ')">Pair</button>'
                      + '</div>';
            });
            div.innerHTML = html;
        }

        function pairCamera(addr, addrType) {
            /* Pairing cancels the BLE scan on the firmware side — reflect that in the UI */
            if (scanning) {
                clearInterval(pollTimer);
                pollTimer = null;
                setScanningState(false);
            }
            setScanStatus('Pairing with ' + addr + '\u2026');
            fetch('/api/pair', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ addr: addr, addr_type: addrType })
            })
            .then(function (r) { return r.json(); })
            .then(function () {
                setScanStatus('Pairing initiated \u2014 camera should appear in the list shortly.');
                document.getElementById('results').innerHTML = '';
            })
            .catch(function () { setScanStatus('Error sending pair request.'); });
        }

        /* ---- Per-camera shutter toggle ---- */

        function setCameraRecording(slot, on) {
            /* Disable immediately — stays disabled until the next refreshCameraStatus()
             * re-renders the list, which naturally produces a fresh enabled button. */
            var btn = document.getElementById('cam-shutter-' + slot);
            if (btn) { btn.disabled = true; }

            fetch('/api/shutter', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ slot: slot, on: on })
            })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var n = data.dispatched || 0;
                if (n === 0) {
                    setStatus('Camera ' + (slot + 1) + ' not ready.');
                } else {
                    setStatus((on ? 'Record started' : 'Record stopped') +
                              ' on camera ' + (slot + 1) + '.');
                }
            })
            .catch(function () { setStatus('Error sending shutter command.'); });
        }

        /* ---- Shutter (start / stop recording — all cameras) ---- */

        function sendShutter(on) {
            var startBtn = document.getElementById('start-btn');
            var stopBtn  = document.getElementById('stop-btn');
            startBtn.disabled = true;
            stopBtn.disabled  = true;
            setStatus((on ? 'Starting' : 'Stopping') + ' recording\u2026');

            fetch('/api/shutter', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ on: on })
            })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var n = data.dispatched || 0;
                if (n === 0) {
                    setStatus('No cameras ready \u2014 is any camera connected and GATT-set-up?');
                } else {
                    setStatus((on ? 'Record started' : 'Record stopped') +
                              ' on ' + n + ' camera' + (n === 1 ? '' : 's') + '.');
                }
            })
            .catch(function () { setStatus('Error sending shutter command.'); })
            .finally(function () {
                startBtn.disabled = false;
                stopBtn.disabled  = false;
            });
        }
    </script>
</body>
</html>
